<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tailwindresultsummary</title>
  </head>
  <body>
    <div id="app">
      <div class="flex items-center justify-center bg-slate-200 min-h-screen p-4">

    <div class="text-zinc-950 bg-white shadow-xl rounded-3xl flex flex-col md:flex-row max-w-2xl w-full overflow-hidden">

          <!-- LeftPanel -->
          <div class="bg-linear-to-b from-blue-600 to-blue-800 text-white rounded-3xl p-8 flex-1 flex flex-col items-center justify-center text-center">
             <h1 class="text-lg font-semibold text-blue-100">Your Result</h1>
             <!-- circle -->
             <div class="my-6 bg-linear-to-b from-blue-900 to-blue-700 rounded-full w-46 h-46 flex flex-col items-center justify-center mt-15 order transform -translate-y-6">

                  <p class="text-5xl font-bold">
                      76
                  </p>

                 <p class="text-blue-200">
                    of 100
                </p>
         </div>
             <h2 class="text-2xl font-bold">
                 Great!
            </h2>

            <p class="mt-3 text-blue-200 text-sm max-w-xs">
                  Your score is higher than 65% of the people who have taken these tests.
            </p>
          </div>

          <!-- RightPanel -->
          <div class="flex-1 p-8 ">

         <h3 class="text-xl font-bold mb-6">
                 Summary
         </h3>

          <div class="bg-red-50 rounded-xl p-4 mb-4">
            
            <div class="flex justify-between">
              <div class="flex items-center justify-center gap-2">
            <img src="src/assets/images/icon-reaction.svg" alt="reaction" />
            <p>Reaction</p>
            </div>
            <p>80/100</p>
            </div>
          </div>

          <div class="bg-amber-50 rounded-xl p-4 mb-4">

                       <div class="flex justify-between">

                        <div class="flex items-center justify-center gap-2">
 <img src="src/assets/images/icon-memory.svg" alt="memory">
            <p>Memory</p>
            </div>
            <p>92/100</p>
            </div>
          </div>

                    
 <div class="bg-lime-50 rounded-xl p-4 mb-4">
  <div class="flex justify-between">
    <div class="flex items-center justify-center gap-2">
            <img src="src/assets/images/icon-verbal.svg" alt="memory">

            <p>Verbal</p>
            </div>
            <p>61/100</p>
            </div>
          </div>

                      
<div class="bg-sky-50 rounded-xl p-4 mb-4">
  <div class="flex justify-between">
    <div class="flex items-center justify-center gap-2">
                        <img src="src/assets/images/icon-visual.svg" alt="memory">

            <p>Visual</p>
            </div>
            <p>73/100</p>
            </div>
          </div>

          <div>
                <button class="w-full bg-blue-950 text-white rounded-full py-3 mt-6 hover:bg-indigo-500 transition">
    Continue
</button>

        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
